name: deploy-to-server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy tag (e.g. main or a commit SHA)"
        required: true
        default: main

concurrency:
  group: deploy-em-ai-learning
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/hitairou/em-ai-learning:${{ github.event.inputs.tag }}
  CONTAINER_NAME: em-ai-learning
  HOST_PORT: "3010"
  CONTAINER_PORT: "3000"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check SSH connectivity
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "ssh ok"
            hostname
            docker --version

      - name: Deploy on server via docker pull
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          GHCR_USERNAME: hitairou
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -euo pipefail
            if [ -z "${GHCR_READ_TOKEN:-}" ]; then
              echo "ERROR: GHCR_READ_TOKEN is missing" >&2
              exit 1
            fi

            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null 2>&1
            docker pull "$IMAGE"
            docker rm -f "${CONTAINER_NAME}" || true
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "127.0.0.1:${HOST_PORT}:${CONTAINER_PORT}" \
              -e NODE_ENV=production \
              "${IMAGE}"

            for i in $(seq 1 10); do
              if curl -fsS -I "http://127.0.0.1:${HOST_PORT}" >/dev/null; then
                echo "healthcheck ok"
                docker logout ghcr.io >/dev/null 2>&1 || true
                exit 0
              fi
              echo "healthcheck retry (${i}/10)..."
              sleep 2
            done

            echo "healthcheck failed"
            docker logs --tail 200 "${CONTAINER_NAME}" || true
            docker logout ghcr.io >/dev/null 2>&1 || true
            exit 1
