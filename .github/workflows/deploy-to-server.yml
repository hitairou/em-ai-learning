name: deploy-to-server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable 40-character commit SHA image tag"
        required: true
        type: string
      transport:
        description: "Deployment transport"
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ssh

concurrency:
  group: deploy-em-ai-learning
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  NEW_IMAGE: ghcr.io/hitairou/em-ai-learning:${{ github.event.inputs.tag }}
  CONTAINER_NAME: em-ai-learning
  DATA_VOLUME: em-ai-learning-data
  HOST_PORT: "3010"
  CONTAINER_PORT: "3000"
  PUBLIC_URL: https://edesign.tairoh.com

jobs:
  deploy-self-hosted:
    if: ${{ github.event.inputs.transport == 'self-hosted' }}
    runs-on: [self-hosted, ecorun-esprimo]
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Validate immutable tag and required secrets
        env:
          DEPLOY_TAG: ${{ github.event.inputs.tag }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TAG" =~ ^[0-9a-f]{40}$ ]]
          [ -n "$GHCR_READ_TOKEN" ]
          [ -n "$OPENAI_API_KEY" ]
          [ "${#AUTH_SECRET}" -ge 32 ]
          docker version
          df -h "$HOME"

      - name: Backup, deploy, verify, and rollback on failure
        env:
          NEW_IMAGE: ${{ env.NEW_IMAGE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DATA_VOLUME: ${{ env.DATA_VOLUME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          GHCR_USERNAME: hitairou
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          ADMIN_BOOTSTRAP_NAME: ${{ secrets.ADMIN_BOOTSTRAP_NAME }}
        shell: bash
        run: bash scripts/deploy-production.sh

  deploy-ssh:
    if: ${{ github.event.inputs.transport == 'ssh' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Validate immutable tag and required secrets
        env:
          DEPLOY_TAG: ${{ github.event.inputs.tag }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TAG" =~ ^[0-9a-f]{40}$ ]]
          [ -n "$GHCR_READ_TOKEN" ]
          [ -n "$OPENAI_API_KEY" ]
          [ "${#AUTH_SECRET}" -ge 32 ]
          [ -n "$SSH_HOST" ]
          [ -n "$SSH_USER" ]
          [ -n "$SSH_KEY" ]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Check SSH connectivity and disk space
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -euo pipefail
            docker version
            df -h "$HOME"

      - name: Copy deployment script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: scripts/deploy-production.sh
          target: /tmp/em-ai-learning-deploy-${{ github.run_id }}

      - name: Backup, deploy, verify, and rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_IMAGE: ${{ env.NEW_IMAGE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DATA_VOLUME: ${{ env.DATA_VOLUME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          GHCR_USERNAME: hitairou
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          ADMIN_BOOTSTRAP_NAME: ${{ secrets.ADMIN_BOOTSTRAP_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: NEW_IMAGE,CONTAINER_NAME,DATA_VOLUME,HOST_PORT,CONTAINER_PORT,PUBLIC_URL,GHCR_USERNAME,GHCR_READ_TOKEN,AUTH_SECRET,OPENAI_API_KEY,ADMIN_BOOTSTRAP_EMAIL,ADMIN_BOOTSTRAP_PASSWORD,ADMIN_BOOTSTRAP_NAME
          script: |
            set -euo pipefail
            bash /tmp/em-ai-learning-deploy-${{ github.run_id }}/scripts/deploy-production.sh
            rm -rf /tmp/em-ai-learning-deploy-${{ github.run_id }}
