name: cleanup-expired-uploads

# Runs through the root-owned production broker `em-prodctl`; the runner has no
# direct Docker access. Scheduled runs perform the write cleanup per the
# production retention policy. Manual dispatch is DRY-RUN ONLY (no arbitrary
# write from a user input).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Manual dispatch is dry-run only (kept for clarity)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 15 * * *"
concurrency:
  group: cleanup-expired-uploads
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: [self-hosted, ecorun-esprimo]
    steps:
      - name: Cleanup expired uploads and registrations via production broker
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            # Scheduled retention policy: explicit fixed write verb.
            sudo -n /usr/local/sbin/em-prodctl cleanup-expired-uploads
          else
            # Manual dispatch: dry-run only.
            sudo -n /usr/local/sbin/em-prodctl cleanup-expired-uploads-dry-run
          fi
