name: diagnose-production-account

# Read-only production account diagnosis through the root-owned broker
# `em-prodctl`. The runner has no direct Docker access; the broker runs the
# root-owned diagnostic script inside the production container read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, ecorun-esprimo]
    timeout-minutes: 15
    steps:
      - name: Diagnose production account via production broker
        shell: bash
        env:
          TARGET_LOGIN_EMAIL: ${{ secrets.TARGET_LOGIN_EMAIL }}
        run: |
          set -euo pipefail
          ENVF=/run/user/1000/em-diagnose.env
          umask 077
          printf 'TARGET_LOGIN_EMAIL=%s\n' "${TARGET_LOGIN_EMAIL:-}" > "$ENVF"
          trap 'rm -f "$ENVF"' EXIT
          sudo -n /usr/local/sbin/em-prodctl diagnose-production-account
