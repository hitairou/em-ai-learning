name: recover-production-admin

# Administrator recovery through the root-owned broker `em-prodctl`. The runner
# has no direct Docker access.
#
# Safety: dry-run by default; a real write requires dry_run=false AND
# confirm=RECOVER_PRODUCTION_ADMIN. The broker re-validates the request.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without writing"
        required: false
        default: true
        type: boolean
      confirm:
        description: "Set exactly RECOVER_PRODUCTION_ADMIN when dry_run=false"
        required: false
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, ecorun-esprimo]
    timeout-minutes: 15
    steps:
      - name: Recover administrator via production broker
        shell: bash
        env:
          ADMIN_RECOVERY_EMAIL: ${{ secrets.ADMIN_RECOVERY_EMAIL }}
          ADMIN_RECOVERY_PASSWORD: ${{ secrets.ADMIN_RECOVERY_PASSWORD }}
          ADMIN_RECOVERY_NAME: EM PASS Administrator
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          ENVF=/run/user/1000/em-recover.env
          umask 077
          {
            printf 'ADMIN_RECOVERY_EMAIL=%s\n' "$ADMIN_RECOVERY_EMAIL"
            printf 'ADMIN_RECOVERY_PASSWORD=%s\n' "$ADMIN_RECOVERY_PASSWORD"
            printf 'ADMIN_RECOVERY_NAME=%s\n' "$ADMIN_RECOVERY_NAME"
          } > "$ENVF"
          trap 'rm -f "$ENVF"' EXIT
          if [ "$DRY_RUN" = "true" ]; then
            sudo -n /usr/local/sbin/em-prodctl recover-production-admin-dry-run
          else
            if [ "$CONFIRM" != "RECOVER_PRODUCTION_ADMIN" ]; then
              echo "Refusing to write: dry_run=false requires confirm=RECOVER_PRODUCTION_ADMIN" >&2
              exit 1
            fi
            sudo -n /usr/local/sbin/em-prodctl recover-production-admin
          fi
